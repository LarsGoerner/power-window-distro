# Power Window RK3506 distribution configuration.

DISTRO = "power-window"
DISTRO_NAME = "Power Window RK3506 Linux"
DISTRO_VERSION = "0.1"
DISTRO_CODENAME = "experimental"

SANITY_TESTED_DISTROS ?= ""

# systemd — RK3506B boards have external DDR so RAM is not the constraint
# it was on the RV1106's 128 MB in-package DDR3L.
INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " systemd"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

DISTRO_FEATURES = "largefile ipv4 ipv6 usbhost ${DISTRO_FEATURES_DEFAULT}"

# Headless / framebuffer — RK3506B has no 3D GPU, 2D engine only.
DISTRO_FEATURES:remove = "x11 wayland vulkan"

# QT5 needs opengl
DISTRO_FEATURES:append = " opengl"

# rkbin blobs are proprietary-but-redistributable
LICENSE_FLAGS_ACCEPTED:append = " commercial"

PACKAGE_CLASSES = "package_ipk"

IMAGE_FSTYPES ?= "wic ext4"