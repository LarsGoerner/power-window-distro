#@TYPE: Machine
#@NAME: Power Window
#@SOC: Rockchip RK3506G2
#@DESCRIPTION: Power Window base board with RK3506G2 SoC
#              (tripple Cortex-A7 + Cortex-M0), 128MB integrated DDR3L
#              TF card slot, MIPI DSI 2-lane display connector
#              Target for Power Window distro

require conf/machine/include/power-window-rk3506.inc

# == SOC SUB-VARIANT ==
RKBIN_SOC_VARIANT = "rk3506"

# == U-BOOT ==
# Vendor U-Boot 2017.09 ships a single rk3506_defconfig for the SoC family.
UBOOT_MACHINE = "rk3506_defconfig"

# == BOARD HARDWARE FEATURES ==
# Add "screen" to build the 10.1" DSI panel + touch + USB-HID stack:
#   MACHINE_FEATURES:append = " screen"     (in build/conf/local.conf)
# That switches in the -dsi device tree, the DRM/VOP/MIPI-DSI kernel
# config, and the backlight + goodix-poll driver patches (see the kernel
# recipe). Left off by default so the headless build is unaffected and
# safe with no panel attached. See README "Optional: DSI display".
MACHINE_FEATURES += "emmc wifi bluetooth"

# == KERNEL DEVICE TREE ==
# Provided via kernel recipe (files/rk3506-power-window.dts)
# Vendor BSP kernel 6.1 keeps flat under arch/arm/boot/dts/
KERNEL_DEVICETREE = "rk3506-power-window.dtb"
IMAGE_BOOT_FILES = "zImage ${KERNEL_DEVICETREE};rk3506-power-window.dtb"

# == HOSTNAME ==
# Overrides the default for friendlier shell promts and mDNS.
# Applied via recipes-core/base-files bbappend
hostname:pn-base-file = "power-window"

# == BOOT MEDIA ==
WKS_FILE = "power-window-sd.wks"
