default power-window
label power-window
    kernel /zImage
    fdt /rk3506-power-window.dtb
# M4 (2026-05-16): maxcpus=1 REMOVED for SMP-via-PSCI bring-up
# (was the M3 single-core exit criterion). The board DTS
# /chosen/bootargs is the authoritative cmdline on this vendor
# U-Boot (bootz does not propagate ${bootargs}); this append is
# kept matching defensively.
    append root=/dev/mmcblk0p2 rootfstype=ext4 rootwait earlycon=uart8250,mmio32,0xff0a0000,115200n8 console=ttyS0,115200 panic=10