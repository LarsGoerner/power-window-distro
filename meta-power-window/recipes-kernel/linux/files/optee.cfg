# M5 (2026-05-16): OP-TEE kernel driver for the xtest sanity subset.
# Without CONFIG_TEE/CONFIG_OPTEE there is no /dev/tee* and no way to
# reach our secure world from Linux userspace. olddefconfig resolves
# the deps (ARM_SMCCC etc.) — this SoC already boots via PSCI/smc.
CONFIG_TEE=y
CONFIG_OPTEE=y